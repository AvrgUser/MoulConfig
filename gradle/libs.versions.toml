[versions]
jbAnnotations = "26.1.0"

loom = "1.17-SNAPSHOT"
fabric-api = "0.155.2"
fabric-loader = "0.19.3"
libninepatch = "1.2.0"
lombok = "1.18.48"
junit = "5.14.4"
mockk = "1.14.11"

[libraries]
jbAnnotations = { module = "org.jetbrains:annotations", version.ref = "jbAnnotations" }
libninepatch = { module = "io.github.juuxel:libninepatch", version.ref = "libninepatch" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader"}
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-agent = { module = "io.mockk:mockk-agent-jvm", version.ref = "mockk" }

[plugins]
loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
