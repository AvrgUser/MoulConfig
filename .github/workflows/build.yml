name: Build

on:
    push:
        branches:
            - "**"
        paths-ignore:
            - ".gitignore"
    pull_request:
        branches:
            - "**"
        paths-ignore:
            - ".gitignore"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        name: Build and test
        strategy:
            fail-fast: false
            matrix:
                minecraft_version:
                    - "26.1"
                    - "26.2"
                    - "26.3"

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Setup Java 25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25

            - name: Build and test
              run: ./gradlew ${{ matrix.minecraft_version }}:test ${{ matrix.minecraft_version }}:assemble
